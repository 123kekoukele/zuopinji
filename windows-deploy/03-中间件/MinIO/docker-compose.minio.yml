services:
  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: hadluo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hadluo
      MINIO_ROOT_PASSWORD: HadluoMinio@2026
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  minio-data:
